<div class="container">
    <header>
      <h1>{{ title }}</h1>
      <p class="date">Track your workouts across multiple days</p>
    </header>
  
    <section class="add-workout">
      <h2>Add New Workout</h2>
      <form (ngSubmit)="addWorkout()" #workoutForm="ngForm">
        <div class="form-group">
          <label for="name">Exercise Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="newWorkout.name"
            required
            placeholder="e.g. Push-ups, Squats, etc."
            class="form-control"
          >
        </div>
  
        <div class="form-row">
          <div class="form-group">
            <label for="sets">Sets:</label>
            <input
              type="number"
              id="sets"
              name="sets"
              [(ngModel)]="newWorkout.sets"
              required
              min="1"
              class="form-control"
            >
          </div>
  
          <div class="form-group">
            <label for="reps">Reps:</label>
            <input
              type="number"
              id="reps"
              name="reps"
              [(ngModel)]="newWorkout.reps"
              required
              min="1"
              class="form-control"
            >
          </div>
      </div>
  
        <div class="form-group">
          <label for="date">Date:</label>
          <div class="date-selection">
            <input
              type="date"
              id="date"
              name="date"
              [(ngModel)]="newWorkout.date"
              required
              class="form-control"
            >
            <div class="date-shortcuts">
              <button type="button" (click)="setDateToToday()" class="btn btn-shortcut">Today</button>
              <button type="button" (click)="setDateToYesterday()" class="btn btn-shortcut">Yesterday</button>
            </div>
          </div>
        </div>
  
        <button type="submit" [disabled]="!workoutForm.form.valid" class="btn btn-primary">
          Add Workout
        </button>
      </form>
    </section>
  
    <section class="workout-list">
      <h2>Workout History</h2>
  
      <div *ngIf="workouts.length === 0" class="no-workouts">
        <p>No workouts added yet. Add your first workout above!</p>
      </div>
  
      <div *ngIf="workouts.length > 0" class="workouts">
        <!-- Group by date -->
        <div *ngFor="let group of workoutGroups" class="date-group">
          <h3 class="date-heading">{{ group.dateLabel }}</h3>
  
          <div *ngFor="let workout of group.workouts" class="workout-item">
            <!-- View Mode -->
            <div *ngIf="editingWorkout?.id !== workout.id" class="workout-details">
              <h3>{{ workout.name }}</h3>
              <p>{{ workout.sets }} sets × {{ workout.reps }} reps</p>
  
              <div class="actions">
                <button (click)="startEdit(workout)" class="btn btn-edit">Edit</button>
                <button (click)="deleteWorkout(workout.id)" class="btn btn-delete">Delete</button>
              </div>
            </div>
  
            <!-- Edit Mode -->
            <div *ngIf="editingWorkout?.id === workout.id" class="workout-edit">
              <form (ngSubmit)="saveEdit()" #editForm="ngForm">
                <div class="form-group">
                  <label for="edit-name">Exercise Name:</label>
                  <input
                    type="text"
                    id="edit-name"
                    name="edit-name"
                    [(ngModel)]="editingWorkout!.name"
                    required
                    class="form-control"
                  >
                </div>
  
                <div class="form-row">
                  <div class="form-group">
                    <label for="edit-sets">Sets:</label>
                    <input
                      type="number"
                      id="edit-sets"
                      name="edit-sets"
                      [(ngModel)]="editingWorkout!.sets"
                      required
                      min="1"
                      class="form-control"
                    >
                  </div>
  
                  <div class="form-group">
                    <label for="edit-reps">Reps:</label>
                    <input
                      type="number"
                      id="edit-reps"
                      name="edit-reps"
                      [(ngModel)]="editingWorkout!.reps"
                      required
                      min="1"
                      class="form-control"
                    >
                  </div>
                </div>
  
                <div class="form-group">
                  <label for="edit-date">Date:</label>
                  <input
                    type="date"
                    id="edit-date"
                    name="edit-date"
                    [(ngModel)]="editingWorkout!.date"
                    required
                    class="form-control"
                  >
                </div>
  
                <div class="edit-actions">
                  <button type="submit" [disabled]="!editForm.form.valid" class="btn btn-primary">Save</button>
                  <button type="button" (click)="cancelEdit()" class="btn btn-secondary">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    </div>
